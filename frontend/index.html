<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#315746" />
    <meta
      name="description"
      content="让日常有序，让生活可见。你的私人生活工作区。"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Digital Life · 日常有序</title>
    <script>
      // 主题必须在首帧就定下来：等 /auth/session 回来再切，启动屏与登录页会先闪一下浅色。
      // 这里只读本地缓存的偏好；服务端 user.theme 仍是权威值，登录后由 App.vue 覆盖缓存。
      (function () {
        var choice = "light";
        try {
          choice = localStorage.getItem("digital-life-theme") || "light";
        } catch (error) {
          choice = "light";
        }
        var dark =
          choice === "dark" ||
          (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
