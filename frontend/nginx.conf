map $uri $digital_life_cache_control {
    default "no-cache";
    ~^/api/ "no-store";
    /health "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $digital_life_cache_control always;
    # Re-resolve backend after its container is independently replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://backend:8000;

    location /api/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /health {
        proxy_pass $api_backend;
        proxy_set_header Host $http_host;
    }
    location ~ ^/(sw\.js|service-worker\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
